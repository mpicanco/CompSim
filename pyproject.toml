[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compsim"
version = "0.1.0"
description = "Dynamic chemical process simulator with a node-based GUI"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pymodbus>=3.5",
    "asyncua>=1.0",
]

[project.scripts]
compsim = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "models*", "gui*", "plcio*", "styles*"]

[tool.setuptools.package-data]
styles = ["*.qss"]
